name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [linea-release]

permissions:
  contents: write

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Check latest Linea release and bump cask
        run: |
          LATEST_JSON=$(curl -fsSL https://download.uselinea.com/latest.json || true)
          if [ -z "$LATEST_JSON" ]; then
            echo "Failed to fetch latest.json"
            exit 1
          fi

          NEW_VERSION=$(echo "$LATEST_JSON" | grep -o '"version": *"[^"]*"' | head -1 | cut -d'"' -f4)
          NEW_SHA=$(echo "$LATEST_JSON" | grep -o '"sha256": *"[^"]*"' | head -1 | cut -d'"' -f4)
          CUR_VERSION=$(grep -o 'version "[^"]*"' Casks/linea.rb | cut -d'"' -f2)
          CUR_SHA=$(grep -o 'sha256 "[^"]*"' Casks/linea.rb | cut -d'"' -f2)

          echo "Latest:  v${NEW_VERSION} (${NEW_SHA})"
          echo "Current: v${CUR_VERSION} (${CUR_SHA})"

          if [ -n "$NEW_VERSION" ] && [ -n "$NEW_SHA" ]; then
            if [ "$NEW_VERSION" != "$CUR_VERSION" ] || [ "$NEW_SHA" != "$CUR_SHA" ]; then
              echo "Bumping Linea cask to v${NEW_VERSION}..."
              sed -i -E "s/version \"[^\"]+\"/version \"$NEW_VERSION\"/" Casks/linea.rb
              sed -i -E "s/sha256 \"[^\"]+\"/sha256 \"$NEW_SHA\"/" Casks/linea.rb

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "bump(linea): ${NEW_VERSION}"
              git push origin main
            else
              echo "Linea cask is already up to date."
            fi
          fi
